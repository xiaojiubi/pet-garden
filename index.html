<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>萌宠成长乐园 🐰</title>
  <style>
/* ===== 萌宠成长乐园 - 样式 ===== */
:root {
  --primary: #ff8fab;
  --primary-dark: #e5739e;
  --secondary: #a8e6cf;
  --secondary-dark: #7dd3ae;
  --accent: #ffd93d;
  --danger: #ff6b6b;
  --warning: #ffa94d;
  --bg: #fff5f7;
  --card-bg: #ffffff;
  --text: #4a4a4a;
  --text-light: #8a8a8a;
  --border: #ffe0e9;
  --shadow: 0 4px 16px rgba(255, 143, 171, 0.15);
  --radius: 18px;
  --nav-h: 64px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  user-select: none;
}

/* Emoji 强制使用彩色 emoji 字体 */
.pet-emoji, .pet-display, .stat-icon, .action-icon, .task-icon,
.shop-emoji, .inv-emoji, .wish-emoji, .bubble-emoji, .log-icon, .nav-icon,
.empty-icon, .summary-value, .coins-display, .date-display {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
               "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color",
               "Android Emoji", sans-serif;
  font-style: normal;
  font-weight: normal;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 顶部状态栏 */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(255, 143, 171, 0.3);
}

.date-display {
  font-size: 15px;
  font-weight: 600;
}

.coins-display {
  font-size: 18px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.25);
  padding: 5px 14px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
}

/* 主内容 */
.content {
  flex: 1;
  padding: 16px 14px calc(var(--nav-h) + 20px);
}

/* 底部导航 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  height: var(--nav-h);
  background: #fff;
  display: flex;
  border-top: 1px solid var(--border);
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.05);
}

.nav-btn {
  flex: 1;
  border: none;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  color: var(--text-light);
  transition: all 0.2s;
  font-family: inherit;
}

.nav-btn.active {
  color: var(--primary);
}

.nav-icon {
  font-size: 22px;
}

.nav-label {
  font-size: 11px;
  font-weight: 600;
}

/* 通用卡片 */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== 角色选择页 ===== */
.welcome-screen {
  text-align: center;
  padding: 20px 0;
}

.welcome-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--primary-dark);
  margin-bottom: 8px;
}

.welcome-subtitle {
  font-size: 15px;
  color: var(--text-light);
  margin-bottom: 24px;
}

.pet-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.pet-option {
  background: #fff;
  border: 3px solid transparent;
  border-radius: var(--radius);
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: var(--shadow);
}

.pet-option:hover, .pet-option.selected {
  border-color: var(--primary);
  transform: translateY(-3px);
}

.pet-option .pet-emoji {
  font-size: 48px;
  display: block;
  margin-bottom: 8px;
}

.pet-option .pet-name {
  font-size: 15px;
  font-weight: 700;
}

.pet-option .pet-desc {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

.name-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  text-align: center;
  margin-bottom: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.name-input:focus {
  border-color: var(--primary);
}

/* ===== 主页宠物展示 ===== */
.pet-stage {
  background: linear-gradient(180deg, #e8f4ff 0%, #fff0f5 100%);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
  margin-bottom: 14px;
}

.pet-stage::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: linear-gradient(180deg, transparent, rgba(168, 230, 207, 0.4));
}

/* 成长等级徽章 */
.growth-badge {
  display: inline-block;
  background: linear-gradient(135deg, #ffd93d, #ffa94d);
  color: #5a4500;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 16px;
  margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(255, 169, 77, 0.4);
  position: relative;
  z-index: 1;
}

/* 成长值区域 */
.growth-section {
  background: rgba(255, 255, 255, 0.7);
  border-radius: 12px;
  padding: 10px 14px;
  margin: 10px 0;
  position: relative;
  z-index: 1;
}

.growth-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.growth-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}

.growth-exp {
  font-size: 12px;
  font-weight: 600;
  color: var(--primary-dark);
}

.growth-track {
  height: 10px;
  background: rgba(0, 0, 0, 0.08);
  border-radius: 5px;
  overflow: hidden;
}

.growth-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, #ffd93d, #ff8fab, #a8e6cf);
  background-size: 200% 100%;
  animation: growth-shine 3s linear infinite;
  transition: width 0.6s ease;
}

@keyframes growth-shine {
  0% { background-position: 0% 0; }
  100% { background-position: 200% 0; }
}

.growth-desc {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 6px;
}

.pet-display {
  font-size: 100px;
  line-height: 1.2;
  position: relative;
  z-index: 1;
  animation: bounce 2s ease-in-out infinite;
  display: inline-block;
}

.pet-display.sad {
  animation: shake 0.5s ease-in-out;
}

.pet-display.happy {
  animation: happy-jump 0.6s ease;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px) rotate(-5deg); }
  75% { transform: translateX(8px) rotate(5deg); }
}

@keyframes happy-jump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-30px) scale(1.15); }
  100% { transform: translateY(0) scale(1); }
}

.pet-name-label {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 14px;
}

.stat-bars {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
  position: relative;
  z-index: 1;
}

.stat-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-icon {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.stat-label {
  font-size: 12px;
  width: 36px;
  font-weight: 600;
}

.stat-track {
  flex: 1;
  height: 12px;
  background: rgba(0, 0, 0, 0.08);
  border-radius: 6px;
  overflow: hidden;
}

.stat-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.5s ease;
}

.stat-fill.mood { background: linear-gradient(90deg, #ffd93d, #ffb84d); }
.stat-fill.hunger { background: linear-gradient(90deg, #ff8fab, #ff6b6b); }
.stat-fill.health { background: linear-gradient(90deg, #a8e6cf, #7dd3ae); }

/* 互动按钮组 */
.action-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.action-btn {
  background: #fff;
  border: none;
  border-radius: 14px;
  padding: 14px 8px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  font-family: inherit;
  text-align: center;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn .action-icon {
  font-size: 30px;
  display: block;
  margin-bottom: 4px;
}

.action-btn .action-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.action-btn.disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* ===== 任务页 ===== */
.task-category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.tab-btn {
  border: none;
  background: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  color: var(--text-light);
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  font-family: inherit;
}

.tab-btn.active {
  background: var(--primary);
  color: #fff;
}

.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: #fff;
  border-radius: 14px;
  margin-bottom: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.task-icon {
  font-size: 26px;
  width: 40px;
  text-align: center;
}

.task-info {
  flex: 1;
}

.task-title {
  font-size: 15px;
  font-weight: 600;
}

.task-desc {
  font-size: 12px;
  color: var(--text-light);
}

.task-score {
  font-size: 14px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 10px;
}

.task-score.positive {
  background: #e8f5e9;
  color: #2e7d32;
}

.task-score.negative {
  background: #ffebee;
  color: #c62828;
}

.task-btn {
  border: none;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.task-btn.done {
  background: var(--secondary);
  color: #2e7d32;
}

.task-btn.deduct {
  background: #ffcdd2;
  color: #c62828;
}

.task-actions-edit {
  display: flex;
  gap: 6px;
}

.edit-btn, .delete-btn {
  border: none;
  background: none;
  font-size: 18px;
  cursor: pointer;
  padding: 4px 6px;
}

.add-task-btn {
  width: 100%;
  border: 2px dashed var(--primary);
  background: transparent;
  color: var(--primary);
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
}

/* ===== 商店页 ===== */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.shop-item {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  box-shadow: var(--shadow);
  position: relative;
}

.shop-item .shop-emoji {
  font-size: 42px;
  display: block;
  margin-bottom: 6px;
}

.shop-item .shop-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}

.shop-item .shop-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 8px;
}

.shop-item .shop-type {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.buy-btn {
  border: none;
  background: var(--primary);
  color: #fff;
  padding: 7px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
}

.buy-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

.inventory-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  background: var(--accent);
  color: #5a4500;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
}

/* ===== 库存选择弹窗 ===== */
.inventory-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-height: 320px;
  overflow-y: auto;
}

.inv-item {
  text-align: center;
  padding: 12px 6px;
  border-radius: 12px;
  background: #f9f9f9;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid transparent;
}

.inv-item:hover {
  border-color: var(--primary);
  background: #fff5f7;
}

.inv-item.empty-msg {
  grid-column: 1 / -1;
  background: none;
  color: var(--text-light);
  font-size: 14px;
}

.inv-emoji {
  font-size: 32px;
  display: block;
  margin-bottom: 4px;
}

.inv-name {
  font-size: 11px;
  font-weight: 600;
}

.inv-count {
  font-size: 11px;
  color: var(--text-light);
}

/* ===== 报表页 ===== */
.report-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.summary-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}

.summary-card.alt {
  background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
}

.summary-value {
  font-size: 28px;
  font-weight: 800;
}

.summary-label {
  font-size: 12px;
  opacity: 0.9;
  margin-top: 4px;
}

.week-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 140px;
  padding: 10px 4px;
  gap: 6px;
}

.bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}

.bar {
  width: 100%;
  max-width: 32px;
  background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  border-radius: 6px 6px 0 0;
  min-height: 4px;
  transition: height 0.6s ease;
  position: relative;
}

.bar.negative {
  background: linear-gradient(180deg, var(--danger), #c62828);
}

.bar-value {
  font-size: 10px;
  font-weight: 700;
  color: var(--text);
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

.bar-label {
  font-size: 11px;
  color: var(--text-light);
  font-weight: 600;
}

.log-list {
  max-height: 360px;
  overflow-y: auto;
}

.log-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
}

.log-time {
  color: var(--text-light);
  font-size: 11px;
  width: 50px;
}

.log-icon {
  font-size: 18px;
}

.log-title {
  flex: 1;
  font-weight: 500;
}

.log-score {
  font-weight: 700;
}

.log-score.positive { color: #2e7d32; }
.log-score.negative { color: #c62828; }

/* ===== 心愿页 ===== */
.total-score-banner {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
  margin-bottom: 16px;
}

.total-score-banner .total-value {
  font-size: 36px;
  font-weight: 800;
}

.total-score-banner .total-label {
  font-size: 13px;
  opacity: 0.9;
}

.wish-item {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}

.wish-emoji {
  font-size: 32px;
}

.wish-info {
  flex: 1;
}

.wish-title {
  font-size: 15px;
  font-weight: 600;
}

.wish-cost {
  font-size: 13px;
  color: var(--primary-dark);
  font-weight: 700;
}

.wish-btn {
  border: none;
  background: var(--accent);
  color: #5a4500;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.wish-btn:disabled {
  background: #ddd;
  color: #999;
  cursor: not-allowed;
}

.wish-redeemed {
  background: #f0f0f0;
  color: #999;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 8px;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 400px;
  max-height: 85vh;
  overflow-y: auto;
  animation: modalIn 0.3s ease;
}

@keyframes modalIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-title {
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 16px;
  text-align: center;
}

.modal-field {
  margin-bottom: 14px;
}

.modal-field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.modal-field input,
.modal-field select,
.modal-field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
}

.modal-field input:focus,
.modal-field select:focus {
  border-color: var(--primary);
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn {
  flex: 1;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-cancel {
  background: #f0f0f0;
  color: var(--text-light);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + 20px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  padding: 12px 24px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 600;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
  max-width: 90%;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== 宠物气泡 ===== */
.pet-bubble {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: #fff;
  padding: 16px 24px;
  border-radius: 20px;
  font-size: 20px;
  font-weight: 700;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
  z-index: 250;
  transition: transform 0.3s;
  text-align: center;
}

.pet-bubble.show {
  transform: translate(-50%, -50%) scale(1);
}

.pet-bubble .bubble-emoji {
  font-size: 50px;
  display: block;
  margin-bottom: 6px;
}

  <script>
/* ===== 萌宠成长乐园 - 核心逻辑 ===== */

// ============ 数据存储层 ============
const DB = {
  get(key, def) {
    try {
      const v = localStorage.getItem('bunny_' + key);
      return v ? JSON.parse(v) : def;
    } catch { return def; }
  },
  set(key, val) {
    localStorage.setItem('bunny_' + key, JSON.stringify(val));
  }
};

// ============ 全局状态 ============
let state = {
  currentPage: 'home',
  currentTaskTab: 'all',
  editMode: false
};

// ============ 成长等级配置 ============
// 等级越高，宠物越大；每级所需累计经验递增
const GROWTH_LEVELS = [
  { level: 1, name: '幼崽期',  minExp: 0,   size: 60,  badge: '🥚', desc: '刚出生，需要细心照顾' },
  { level: 2, name: '幼年期',  minExp: 50,  size: 80,  badge: '🌱', desc: '活泼好动，正在成长' },
  { level: 3, name: '少年期',  minExp: 150, size: 100, badge: '🌿', desc: '逐渐长大，更有活力' },
  { level: 4, name: '成年期',  minExp: 300, size: 120, badge: '✨', desc: '完全长大啦！' },
  { level: 5, name: '巅峰期',  minExp: 500, size: 130, badge: '👑', desc: '最强壮的状态' }
];

// 根据经验值获取当前等级信息
function getGrowthInfo(exp) {
  exp = exp || 0;
  let info = GROWTH_LEVELS[0];
  for (let i = 0; i < GROWTH_LEVELS.length; i++) {
    if (exp >= GROWTH_LEVELS[i].minExp) {
      info = GROWTH_LEVELS[i];
    }
  }
  const nextLevel = GROWTH_LEVELS.find(l => l.level === info.level + 1);
  const expInLevel = exp - info.minExp;
  const expForNext = nextLevel ? (nextLevel.minExp - info.minExp) : 0;
  const progress = nextLevel ? Math.min(100, (expInLevel / expForNext) * 100) : 100;
  return {
    ...info,
    exp: exp,
    expInLevel: expInLevel,
    expForNext: expForNext,
    nextLevel: nextLevel,
    progress: progress,
    isMax: !nextLevel
  };
}

// 增加经验值并检查升级
function addExp(amount) {
  const pet = DB.get('pet');
  const oldInfo = getGrowthInfo(pet.exp || 0);
  pet.exp = (pet.exp || 0) + amount;
  DB.set('pet', pet);
  const newInfo = getGrowthInfo(pet.exp);
  // 升级了
  if (newInfo.level > oldInfo.level) {
    setTimeout(() => {
      showPetReaction(pet.emoji, `长大了！${newInfo.badge}${newInfo.name}`, 'happy');
      Sound.play('levelup');
      toast(`🎉 ${pet.name}成长到「${newInfo.name}」了！`);
    }, 800);
  }
}

  document.querySelectorAll('.nav-btn').forEach(btn => {

  });
  const main = document.getElementById('mainContent');
  switch (page) {
    case 'home': main.innerHTML = renderHome(); bindHomeEvents(); break;
    case 'tasks': main.innerHTML = renderTasks(); break;
    case 'shop': main.innerHTML = renderShop(); break;
    case 'report': main.innerHTML = renderReport(); break;
    case 'wishes': main.innerHTML = renderWishes(); break;

}

function getMoodStatus(mood) {
  if (mood >= 80) return '😄';
  if (mood >= 60) return '🙂';
  if (mood >= 40) return '😐';
  if (mood >= 20) return '😢';
  return '😭';
}

function renderInventoryMini(inventory) {
  const shop = DB.get('shop', []);
  const items = Object.keys(inventory).filter(id => inventory[id] > 0);
  if (items.length === 0) {
    return '<div class="empty-state"><span class="empty-icon">📦</span>背包空空的，去商店买点东西吧~</div>';
  }
  return `
    <div class="inventory-grid">
      ${items.map(id => {
        const item = shop.find(s => s.id === id);
        if (!item) return '';
        return `
          <div class="inv-item" onclick="useItem('${id}')">
            <span class="inv-emoji">${item.icon}</span>
            <div class="inv-name">${item.name}</div>
            <div class="inv-count">x${inventory[id]}</div>
          </div>

      }).join('')}

  `;
}

function useItem(itemId, fromFeedMenu) {
  const inventory = DB.get('inventory', {});
  const shop = DB.get('shop', []);
  const item = shop.find(s => s.id === itemId);
  if (!item || !inventory[itemId] || inventory[itemId] <= 0) return;

  const pet = DB.get('pet');

  // 根据物品类型应用效果
  let expGain = 0;
  if (item.type === 'food') {
    pet.hunger = Math.min(100, pet.hunger + 25);
    pet.mood = Math.min(100, pet.mood + 10);
    showPetReaction(`${pet.emoji}`, '好吃好吃！', 'happy');
    Sound.play('eat');
    addLog('🍽️', `喂${pet.name}吃${item.name}`, 0, 'feed');
    expGain = 5;
  } else if (item.type === 'toy') {
    pet.mood = Math.min(100, pet.mood + 30);
    pet.hunger = Math.max(0, pet.hunger - 5);
    showPetReaction(`${pet.emoji}`, '好开心呀！', 'happy');
    Sound.play('happy');
    addLog('🎾', `用${item.name}陪${pet.name}玩`, 0, 'play');
    expGain = 3;
  } else if (item.type === 'medicine') {
    pet.health = Math.min(100, pet.health + 35);
    pet.mood = Math.max(0, pet.mood - 5);
    showPetReaction(`${pet.emoji}`, '感觉好多了~', 'happy');
    Sound.play('heal');
    addLog('🏥', `给${pet.name}用${item.name}`, 0, 'heal');
    expGain = 8;
  }

  inventory[itemId]--;
  if (inventory[itemId] <= 0) delete inventory[itemId];
  DB.set('inventory', inventory);
  DB.set('pet', pet);

  // 先导航再增加经验（addExp 可能触发升级提示，需要在页面渲染后）
  if (fromFeedMenu) closeModal();
  navigate('home');
  if (expGain > 0) addExp(expGain);
}

// ============ 宠物反应气泡 ============
function showPetReaction(emoji, text, mood) {
  const bubble = document.getElementById('petBubble');
  bubble.innerHTML = `<span class="bubble-emoji">${emoji}</span>${text}`;
  bubble.style.display = 'block';
  setTimeout(() => bubble.classList.add('show'), 10);
  setTimeout(() => {
    bubble.classList.remove('show');
    setTimeout(() => bubble.style.display = 'none', 300);
  }, 1800);

  // 给宠物添加动画
  const petEl = document.getElementById('petDisplay');
  if (petEl) {
    petEl.classList.remove('sad', 'happy');
    if (mood === 'happy') {
      petEl.classList.add('happy');
      setTimeout(() => petEl.classList.remove('happy'), 600);
    } else if (mood === 'sad') {
      petEl.classList.add('sad');
      setTimeout(() => petEl.classList.remove('sad'), 500);
    }
  }
}

function renderTaskRow(t, editMode) {
  if (editMode) {
    return `

      </div>
    `;
  }
  return `

        <div class="task-desc">${t.desc}</div>

      <button class="task-btn ${t.type === 'positive' ? 'done' : 'deduct'}" onclick="completeTask('${t.id}')">
        ${t.type === 'positive' ? '完成' : '扣分'}
      </button>
    </div>
  `;
}

function switchTaskTab(tab) {
  state.currentTaskTab = tab;
  navigate('tasks');
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  navigate('tasks');
}

function completeTask(taskId) {
  const tasks = DB.get('tasks', []);
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  const coins = DB.get('coins', 0);
  const totalScore = DB.get('totalScore', 0);
  const pet = DB.get('pet');

  const newCoins = coins + task.score;
  if (newCoins < 0) {
    toast('金币不足，无法扣分！');
    Sound.play('error');
    return;
  }

  DB.set('coins', newCoins);
  updateCoins();

  if (task.type === 'positive') {
    DB.set('totalScore', totalScore + task.score);
    // 宠物开心
    pet.mood = Math.min(100, pet.mood + 3);
    DB.set('pet', pet);
    Sound.play('success');
    showPetReaction(pet.emoji, '太棒了！', 'happy');
    toast(`完成「${task.title}」+${task.score}🪙`);
    // 完成任务获得经验值（积分的1.5倍，至少2点）
    addExp(Math.max(2, Math.ceil(task.score * 1.5)));
  } else {
    // 扣分 -> 宠物难过
    pet.mood = Math.max(0, pet.mood - 15);
    DB.set('pet', pet);
    Sound.play('sad');
    showPetReaction(pet.emoji, '呜呜...', 'sad');
    toast(`「${task.title}」${task.score}🪙`);
  }

  addLog(task.icon, task.title, task.score, task.type);
}

  const shop = DB.get('shop', []);
  const item = shop.find(s => s.id === itemId);
  if (!item) return;

  const coins = DB.get('coins', 0);
  if (coins < item.price) {
    toast('金币不足，无法购买！');
    Sound.play('error');
    return;
  }

  DB.set('coins', coins - item.price);
  const inventory = DB.get('inventory', {});
  inventory[itemId] = (inventory[itemId] || 0) + 1;
  DB.set('inventory', inventory);

  updateCoins();
  Sound.play('buy');
  toast(`购买「${item.name}」成功！`);

  toast('修改成功！');
}

function deleteShopItem(itemId) {
  if (!confirm('确定删除这个商品吗？')) return;
  let shop = DB.get('shop', []);
  shop = shop.filter(s => s.id !== itemId);
  DB.set('shop', shop);
  navigate('shop');
  toast('已删除');
}

// ============ 报表页 ============
function renderReport() {
  const logs = DB.get('logs', []);
  const today = todayKey();

  // 今日数据
  const todayLogs = logs.filter(l => l.date === today);
  const todayScore = todayLogs.filter(l => l.scoreType !== 'feed' && l.scoreType !== 'play' && l.scoreType !== 'heal')
    .reduce((sum, l) => sum + l.score, 0);
  const todayPositive = todayLogs.filter(l => l.score > 0).reduce((s, l) => s + l.score, 0);
  const todayNegative = todayLogs.filter(l => l.score < 0).reduce((s, l) => s + l.score, 0);

  // 周数据（近7天）
  const weekData = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const dayLogs = logs.filter(l => l.date === key && l.scoreType !== 'feed' && l.scoreType !== 'play' && l.scoreType !== 'heal');
    const dayScore = dayLogs.reduce((sum, l) => sum + l.score, 0);
    weekData.push({
      label: `${d.getMonth() + 1}/${d.getDate()}`,
      score: dayScore,
      isToday: key === today
    });
  }

  const maxAbs = Math.max(10, ...weekData.map(d => Math.abs(d.score)));

  const totalScore = DB.get('totalScore', 0);

  // 今日明细
  const todayDetails = [...todayLogs].reverse();

  return `
    <div class="report-summary">
      <div class="summary-card">
        <div class="summary-value">${todayScore >= 0 ? '+' : ''}${todayScore}</div>
        <div class="summary-label">今日积分</div>
      </div>
      <div class="summary-card alt">
        <div class="summary-value">${totalScore}</div>
        <div class="summary-label">累计总积分</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">📊 近7天积分</div>
      <div class="week-chart">
        ${weekData.map(d => `
          <div class="bar-col">
            <div class="bar ${d.score < 0 ? 'negative' : ''}" style="height:${Math.max(4, (Math.abs(d.score) / maxAbs) * 100)}%">
              <span class="bar-value">${d.score !== 0 ? d.score : ''}</span>
            </div>
            <div class="bar-label" style="${d.isToday ? 'color:var(--primary);font-weight:700;' : ''}">${d.label}</div>
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--text-light);justify-content:center;">
        <span>🟢 加分：${todayPositive}</span>
        <span>🔴 扣分：${todayNegative}</span>
      </div>
    </div>
    <div class="card">
      <div class="section-title">📝 今日明细</div>
      <div class="log-list">
        ${todayDetails.length === 0 ? '<div class="empty-state"><span class="empty-icon">📋</span>今天还没有记录哦</div>' :
          todayDetails.map(l => `
            <div class="log-item">
              <span class="log-time">${l.time}</span>
              <span class="log-icon">${l.icon}</span>
              <span class="log-title">${l.title}</span>
              ${l.score !== 0 ? `<span class="log-score ${l.score > 0 ? 'positive' : 'negative'}">${l.score > 0 ? '+' : ''}${l.score}</span>` : ''}
            </div>
          `).join('')}
      </div>
    </div>
  `;
}

// ============ 心愿页 ============
function renderWishes() {
  const wishes = DB.get('wishes', []);
  const totalScore = DB.get('totalScore', 0);
  const redeemed = DB.get('redeemedWishes', []);

  return `
    <div class="total-score-banner">
      <div class="total-value">${totalScore}</div>
      <div class="total-label">🌟 可用总积分（兑换心愿后扣除）</div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="section-title" style="margin-bottom:0;">🌟 心愿清单</div>
        <button class="btn btn-primary" style="flex:none;padding:6px 14px;font-size:13px;" onclick="toggleWishEditMode()">
          ${state.wishEditMode ? '✅ 完成' : '✏️ 编辑'}
        </button>
      </div>
      ${wishes.length === 0 ? '<div class="empty-state"><span class="empty-icon">🌟</span>还没有心愿，添加一个吧</div>' :
        wishes.map(w => {
          const isRedeemed = redeemed.includes(w.id);
          const canAfford = totalScore >= w.cost;
          return `
            <div class="wish-item">
              <span class="wish-emoji">${w.icon}</span>
              <div class="wish-info">
                <div class="wish-title">${w.title}</div>
                <div class="wish-cost">需要 ${w.cost} 积分</div>
              </div>
              ${state.wishEditMode ? `
                <div style="display:flex;gap:6px;">
                  <button class="btn btn-primary" style="padding:6px 10px;font-size:12px;" onclick="editWish('${w.id}')">✏️</button>
                  <button class="btn btn-cancel" style="padding:6px 10px;font-size:12px;" onclick="deleteWish('${w.id}')">🗑️</button>
                </div>
              ` : (isRedeemed ? `
                <span class="wish-redeemed">已兑换</span>
              ` : `
                <button class="wish-btn" onclick="redeemWish('${w.id}')" ${!canAfford ? 'disabled' : ''}>
                  ${canAfford ? '兑换' : '积分不足'}
                </button>
              `)}
            </div>
          `;
        }).join('')}
      ${state.wishEditMode ? `
        <button class="add-task-btn" onclick="addWish()">➕ 添加新心愿</button>
      ` : ''}
    </div>
    ${redeemed.length > 0 ? `
      <div class="card">
        <div class="section-title">🎁 已兑换的心愿</div>
        ${redeemed.map(id => {
          const w = wishes.find(x => x.id === id);
          return w ? `<div class="log-item"><span class="log-icon">${w.icon}</span><span class="log-title">${w.title}</span><span class="log-score positive">已实现</span></div>` : '';
        }).join('')}
      </div>
    ` : ''}
  `;
}

function toggleWishEditMode() {
  state.wishEditMode = !state.wishEditMode;
  navigate('wishes');
}

function redeemWish(wishId) {
  const wishes = DB.get('wishes', []);
  const wish = wishes.find(w => w.id === wishId);
  if (!wish) return;

  const totalScore = DB.get('totalScore', 0);
  if (totalScore < wish.cost) {
    toast('积分不足，继续努力！');
    Sound.play('error');
    return;
  }

  if (!confirm(`确定用 ${wish.cost} 积分兑换「${wish.title}」吗？`)) return;

  DB.set('totalScore', totalScore - wish.cost);
  const redeemed = DB.get('redeemedWishes', []);
  redeemed.push(wishId);
  DB.set('redeemedWishes', redeemed);

  addLog('🎁', `兑换心愿：${wish.title}`, -wish.cost, 'redeem');
  Sound.play('success');
  toast(`🎉 心愿「${wish.title}」兑换成功！`);
  navigate('wishes');
}

function addWish() {
  const html = `
    <div class="modal-title">➕ 添加心愿</div>
    <div class="modal-field">
      <label>心愿图标（输入emoji）</label>
      <input type="text" id="newWishIcon" placeholder="如：🚗" maxlength="4" value="🎁">
    </div>
    <div class="modal-field">
      <label>心愿内容</label>
      <input type="text" id="newWishTitle" placeholder="如：买一个新玩具">
    </div>
    <div class="modal-field">
      <label>需要积分</label>
      <input type="number" id="newWishCost" placeholder="如：100" value="100">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveNewWish()">保存</button>
    </div>
  `;
  showModal(html);
}

function saveNewWish() {
  const icon = document.getElementById('newWishIcon').value.trim() || '🎁';
  const title = document.getElementById('newWishTitle').value.trim();
  const cost = parseInt(document.getElementById('newWishCost').value) || 100;

  if (!title) { toast('请填写心愿内容'); return; }

  const wishes = DB.get('wishes', []);
  wishes.push({ id: 'w' + Date.now(), icon, title, cost });
  DB.set('wishes', wishes);
  closeModal();
  navigate('wishes');
  toast('心愿添加成功！');
}

function editWish(wishId) {
  const wishes = DB.get('wishes', []);
  const wish = wishes.find(w => w.id === wishId);
  if (!wish) return;

  const html = `
    <div class="modal-title">✏️ 编辑心愿</div>
    <div class="modal-field">
      <label>心愿图标</label>
      <input type="text" id="editWishIcon" value="${wish.icon}" maxlength="4">
    </div>
    <div class="modal-field">
      <label>心愿内容</label>
      <input type="text" id="editWishTitle" value="${wish.title}">
    </div>
    <div class="modal-field">
      <label>需要积分</label>
      <input type="number" id="editWishCost" value="${wish.cost}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEditWish('${wishId}')">保存</button>
    </div>
  `;
  showModal(html);
}

function saveEditWish(wishId) {
  const wishes = DB.get('wishes', []);
  const idx = wishes.findIndex(w => w.id === wishId);
  if (idx === -1) return;

  const icon = document.getElementById('editWishIcon').value.trim() || '🎁';
  const title = document.getElementById('editWishTitle').value.trim();
  const cost = parseInt(document.getElementById('editWishCost').value) || 100;

  if (!title) { toast('请填写心愿内容'); return; }

  wishes[idx] = { ...wishes[idx], icon, title, cost };
  DB.set('wishes', wishes);
  closeModal();
  navigate('wishes');
  toast('修改成功！');
}

function deleteWish(wishId) {
  if (!confirm('确定删除这个心愿吗？')) return;
  let wishes = DB.get('wishes', []);
  wishes = wishes.filter(w => w.id !== wishId);
  DB.set('wishes', wishes);
  navigate('wishes');
  toast('已删除');
}

// ============ 日志记录 ============
function addLog(icon, title, score, scoreType) {
  const logs = DB.get('logs', []);
  const now = new Date();
  logs.push({
    date: todayKey(),
    time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
    icon, title, score, scoreType
  });
  // 保留最近500条
  if (logs.length > 500) logs = logs.slice(-500);
  DB.set('logs', logs);
}

// ============ 弹窗 ============
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============ Toast ============
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.style.display = 'none', 300);
  }, 2200);
}

// ============ 音效系统（Web Audio API 合成） ============
const Sound = {
  ctx: null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { console.warn('Audio not supported'); }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },
  play(type) {
    this.init();
    if (!this.ctx) return;
    switch(type) {
      case 'eat': this.eatSound(); break;
      case 'success': this.successSound(); break;
      case 'happy': this.happySound(); break;
      case 'sad': this.sadSound(); break;
      case 'error': this.errorSound(); break;
      case 'buy': this.buySound(); break;
      case 'heal': this.healSound(); break;
      case 'levelup': this.levelupSound(); break;
    }
  },
  // 播放单个音符
  note(freq, startTime, duration, type = 'sine', volume = 0.3) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  },
  eatSound() {
    const t = this.ctx.currentTime;
    // 咀嚼声 - 短促的音
    this.note(400, t, 0.08, 'square', 0.15);
    this.note(350, t + 0.1, 0.08, 'square', 0.15);
    this.note(300, t + 0.2, 0.1, 'square', 0.12);
    this.note(500, t + 0.35, 0.15, 'sine', 0.2);
  },
  successSound() {
    const t = this.ctx.currentTime;
    // 上升音阶 do-mi-sol-do
    this.note(523, t, 0.12, 'sine', 0.25);
    this.note(659, t + 0.1, 0.12, 'sine', 0.25);
    this.note(784, t + 0.2, 0.12, 'sine', 0.25);
    this.note(1047, t + 0.3, 0.3, 'sine', 0.3);
  },
  happySound() {
    const t = this.ctx.currentTime;
    this.note(659, t, 0.1, 'triangle', 0.2);
    this.note(784, t + 0.08, 0.1, 'triangle', 0.2);
    this.note(988, t + 0.16, 0.2, 'triangle', 0.25);
    this.note(1319, t + 0.3, 0.3, 'triangle', 0.2);
  },
  sadSound() {
    const t = this.ctx.currentTime;
    // 下降音
    this.note(440, t, 0.2, 'sine', 0.2);
    this.note(392, t + 0.15, 0.2, 'sine', 0.2);
    this.note(349, t + 0.3, 0.4, 'sine', 0.2);
  },
  errorSound() {
    const t = this.ctx.currentTime;
    this.note(200, t, 0.15, 'sawtooth', 0.15);
    this.note(150, t + 0.1, 0.2, 'sawtooth', 0.15);
  },
  buySound() {
    const t = this.ctx.currentTime;
    // 金币叮声
    this.note(988, t, 0.08, 'triangle', 0.2);
    this.note(1319, t + 0.05, 0.08, 'triangle', 0.2);
    this.note(1568, t + 0.1, 0.25, 'triangle', 0.25);
  },
  healSound() {
    const t = this.ctx.currentTime;
    // 温柔的上升音
    this.note(523, t, 0.15, 'sine', 0.2);
    this.note(659, t + 0.12, 0.15, 'sine', 0.2);
    this.note(784, t + 0.24, 0.3, 'sine', 0.25);
  },
  levelupSound() {
    const t = this.ctx.currentTime;
    // 欢快的上升音阶 + 闪亮高音
    this.note(523, t, 0.1, 'triangle', 0.25);
    this.note(659, t + 0.08, 0.1, 'triangle', 0.25);
    this.note(784, t + 0.16, 0.1, 'triangle', 0.25);
    this.note(1047, t + 0.24, 0.1, 'triangle', 0.3);
    this.note(1319, t + 0.32, 0.15, 'triangle', 0.3);
    this.note(1568, t + 0.42, 0.4, 'triangle', 0.35);
  }
};

// 首次点击解锁音频
document.addEventListener('click', function unlockAudio() {
  Sound.init();
  document.removeEventListener('click', unlockAudio);
}, { once: true });

// ============ 启动 ============
document.addEventListener('DOMContentLoaded', init);

</script>
